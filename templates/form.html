<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Path Predictor</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { color: inherit; }
    .form-section {
      padding: 2rem;
      border-radius: 1rem;
      animation: fadeIn 1s ease-in-out;
      border: 1px solid var(--border);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    label {
      margin-top: 1rem;
      font-weight: 600;
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}?v=20260516">
</head>
<body>
<nav class="navbar navbar-expand-lg app-navbar">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">>_ Career Path Predictor</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/quiz">Take Quiz</a></li>
        <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
            <span data-theme-icon>🌙</span>
            <span data-theme-label>Dark</span>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container page-shell">
  <div class="form-section glass-card">
    <h2 class="mb-4 section-title">Career Path Predictor</h2>
    <form action="/predict" method="POST">
      <label>Passion</label>
      <select class="form-select" name="passion">
        {% for p in passions %}<option>{{ p }}</option>{% endfor %}
      </select>

      <label>Hobby</label>
      <select class="form-select" name="hobby">
        {% for h in hobbies %}<option>{{ h }}</option>{% endfor %}
      </select>

      <label>Education</label>
      <select class="form-select" name="education">
        {% for e in educations %}<option>{{ e }}</option>{% endfor %}
      </select>

      <label>Age</label>
      <select class="form-select" name="age">
        {% for a in ages %}<option>{{ a }}</option>{% endfor %}
      </select>

      <label>Skills (select multiple)</label>
      <select class="form-select" name="skills" multiple size="5">
        {% for s in skills %}<option>{{ s }}</option>{% endfor %}
      </select>

      <button class="btn btn-primary-custom mt-4" type="submit">Predict Career</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
